[project]
name = "job-hunter"
version = "0.1.0"
description = "Personal career bot — CV adaptation and job application tracker powered by Claude AI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
job-hunter = "job_hunter.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["job_hunter*"]
