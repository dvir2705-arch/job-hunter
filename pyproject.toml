[project]
name = "job-hunter"
version = "0.1.0"
description = "AI-powered career management CLI — CV adaptation, job scraping, application tracking, and cover letter generation powered by Claude AI"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dvir Salomon"}]
keywords = ["job-hunting", "cv-adaptation", "cli", "ai", "career", "claude", "job-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
    "Environment :: Console",
]
dependencies = [
    "click>=8.1",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "python-docx>=1.1",
]

[project.urls]
Repository = "https://github.com/dvir2705-arch/job-hunter"

[project.scripts]
job-hunter = "job_hunter.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["job_hunter*"]
